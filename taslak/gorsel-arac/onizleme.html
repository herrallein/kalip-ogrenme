<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Görsel önizleme</title>
<style>
  body{font-family:system-ui,sans-serif;margin:20px;background:#fafafa;color:#222}
  h1{font-size:20px}
  .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
  .c{background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px}
  .c img{width:100%;display:block}
  .c b{display:block;margin-top:8px;font-size:14px;font-family:ui-monospace,monospace}
  .c p{margin:6px 0 0;font-size:14px;color:#444}
  .row{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 22px}
  .row img{width:160px;height:100px;border-radius:12px;border:1px solid #ddd}
</style>
<h1>Görsel önizleme (<span id="cnt"></span>)</h1>
<div class="row" id="row"></div>
<div class="g" id="grid"></div>
<script>
fetch('/visuals/meta.json?'+Date.now()).then(r=>r.json()).then(meta=>{
  const ids=Object.keys(meta).sort();
  document.getElementById('cnt').textContent=ids.length+' görsel';
  const t=Date.now();
  document.getElementById('row').innerHTML=ids.map(i=>`<img src="/visuals/${i}.svg?${t}" alt="${meta[i].alt||''}" title="${i}">`).join('');
  document.getElementById('grid').innerHTML=ids.map(i=>`<div class="c"><img src="/visuals/${i}.svg?${t}" alt="${meta[i].alt||''}"><b>${i}</b><p>${meta[i].cue||''}</p></div>`).join('');
});
</script>
